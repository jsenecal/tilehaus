<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Tilehaus Configurator</title>
    <!-- Web fonts are a nicety: loaded without blocking first paint, so a LAN
         with no internet renders at once in the system fallbacks. The panel
         itself uses these two families, so the preview matches it when they load. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet" media="print" onload="this.media='all'"
    />
    <style>
      /* The panel's editorial look: an off-white page, square charcoal tiles,
         lime for active, heavy grotesk titles with a short ink bar, mono
         captions. Dark mode is the panel's night page. Colours match
         firmware/native/palette.h and theme.h. */
      :root {
        --page: #e9e6e0;
        --surface: #f4f2ed;
        --ink: #141414;
        --muted: #5c5955;
        --faint: #8a8681;
        --rule: rgba(20, 20, 20, 0.16);
        --rule-strong: #141414;
        --input: #fbfaf7;
        --tile: #313131;
        --accent: #b5e853;            /* the deck accent; set live from the deck */
        --accent-ink: #141414;
        --ok: #2e7d32;
        --warn: #b7791f;
        --err: #c62828;
        --bezel: #1b1b1b;
        --sans: "Inter Tight", "Helvetica Neue", Arial, system-ui, sans-serif;
        --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --page: #0e0e0e;
          --surface: #171717;
          --ink: #f2f0ec;
          --muted: #a19d97;
          --faint: #6f6b66;
          --rule: rgba(242, 240, 236, 0.16);
          --rule-strong: #f2f0ec;
          --input: #121212;
          --bezel: #000;
          --warn: #e0a526;
          --err: #f06a5a;
          --ok: #6cc070;
          color-scheme: dark;
        }
      }

      * { box-sizing: border-box; }
      html, body { margin: 0; }
      body {
        background: var(--page); color: var(--ink);
        font-family: var(--sans); font-size: 15px; line-height: 1.45;
        -webkit-font-smoothing: antialiased;
      }
      #app { min-height: 100vh; }
      .boot { padding: 2rem; font-family: var(--mono); color: var(--muted); }

      /* ---- Controls: square, inked ---- */
      button, input, select {
        font: inherit; color: var(--ink); border-radius: 0;
      }
      button {
        padding: 0.5rem 0.85rem; cursor: pointer; font-weight: 600;
        background: transparent; border: 2px solid var(--rule-strong);
      }
      button:hover:not(:disabled) { background: var(--rule); }
      button:disabled { opacity: 0.45; cursor: default; }
      button.ghost { border-color: var(--rule); }
      button.ghost:hover:not(:disabled) { border-color: var(--rule-strong); background: transparent; }
      button.small { padding: 0.25rem 0.55rem; font-size: 0.8rem; }
      button.primary, button.primary-ink {
        background: var(--accent); color: var(--accent-ink); border-color: var(--accent);
      }
      button.primary:hover:not(:disabled), button.primary-ink:hover:not(:disabled) { filter: brightness(0.94); background: var(--accent); }
      button.danger { color: var(--err); border-color: var(--err); }
      input[type="text"], input[type="password"], input[type="number"], select {
        width: 100%; padding: 0.5rem 0.6rem;
        background: var(--input); border: 2px solid var(--rule-strong);
      }
      input[type="number"] { width: 4.5rem; }
      input:focus, select:focus, button:focus-visible {
        outline: 3px solid var(--accent); outline-offset: 1px;
      }
      input[type="checkbox"] { accent-color: var(--ink); width: 16px; height: 16px; cursor: pointer; }
      svg.icon { display: block; width: 1em; height: 1em; fill: currentColor; flex: none; }

      /* ---- App layout: header, sidebar, preview, inspector ---- */
      .app {
        display: grid; min-height: 100vh;
        grid-template-columns: 240px minmax(0, 1fr) 340px;
        grid-template-rows: auto 1fr;
        grid-template-areas: "head head head" "side stage insp";
      }
      .app-head {
        grid-area: head; display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
        padding: 0.8rem 1.1rem; border-bottom: 2px solid var(--rule-strong);
      }
      .brand { display: flex; align-items: center; gap: 0.6rem; }
      .brand .mark { width: 16px; height: 16px; background: var(--accent); box-shadow: 4px 4px 0 var(--ink); }
      .brand-name { font-weight: 900; font-size: 1.35rem; letter-spacing: -0.03em; margin-left: 4px; }
      .brand-host {
        font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.08em; color: var(--muted);
        text-transform: uppercase; margin-left: 0.4rem;
      }
      .actions { margin-left: auto; display: flex; align-items: center; gap: 0.45rem; flex-wrap: wrap; }

      .sidebar {
        grid-area: side; border-right: 2px solid var(--rule-strong);
        padding: 1rem; display: flex; flex-direction: column; gap: 1.6rem;
      }
      .side-sec { display: flex; flex-direction: column; gap: 0.6rem; }
      .side-cap {
        margin: 0; font-family: var(--mono); font-size: 0.72rem; font-weight: 500;
        letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted);
      }
      .page-list { display: flex; flex-direction: column; gap: 3px; }
      .page-item {
        display: flex; justify-content: space-between; align-items: center; gap: 0.5rem;
        text-align: left; border: none; padding: 0.5rem 0.65rem; font-weight: 600;
      }
      .page-item.active { background: var(--ink); color: var(--page); }
      .page-item.active:hover { background: var(--ink); }
      .page-item .page-count { font-family: var(--mono); font-size: 0.72rem; opacity: 0.65; font-weight: 500; }
      .page-item.add { color: var(--muted); font-weight: 500; }
      .page-edit { display: flex; flex-direction: column; gap: 0.4rem; }
      .grid-picker, .accent-picker { display: flex; align-items: center; gap: 0.45rem; flex-wrap: wrap; }
      .grid-picker, .accent-picker { flex-wrap: nowrap; }
      .grid-picker .flabel, .accent-picker .flabel { width: 3.4rem; flex: none; }
      .grid-picker input[type="number"] { width: 3.6rem; }
      .grid-x { color: var(--muted); }
      .accent-picker input[type="color"] {
        width: 40px; height: 32px; padding: 0; border: 2px solid var(--rule-strong); background: none; cursor: pointer;
      }

      .stage { grid-area: stage; padding: 1rem 1.2rem 2rem; display: flex; flex-direction: column; gap: 0.7rem; min-width: 0; }
      .toolbar { display: flex; align-items: center; gap: 0.45rem; flex-wrap: wrap; }
      .toolbar select { width: auto; min-width: 12rem; }
      .toolbar .spacer { flex: 1 1 auto; }
      .seg { display: flex; border: 2px solid var(--rule-strong); }
      .seg button { border: none; padding: 0.4rem 0.75rem; font-family: var(--mono); font-size: 0.75rem; letter-spacing: 0.06em; text-transform: uppercase; }
      .seg button.sel { background: var(--ink); color: var(--page); }
      .pv-cap { font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }

      .inspector {
        grid-area: insp; border-left: 2px solid var(--rule-strong);
        padding: 1rem; display: flex; flex-direction: column; gap: 0.9rem; min-width: 0;
      }
      .no-selection { margin: 0; color: var(--muted); }

      @media (max-width: 1180px) {
        .app { grid-template-columns: 220px minmax(0, 1fr); grid-template-rows: auto auto 1fr; grid-template-areas: "head head" "side stage" "side insp"; }
        .inspector { border-left: none; border-top: 2px solid var(--rule-strong); }
      }
      @media (max-width: 760px) {
        .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto; grid-template-areas: "head" "side" "stage" "insp"; }
        .sidebar { border-right: none; border-bottom: 2px solid var(--rule-strong); }
        .toolbar select { min-width: 0; flex: 1 1 100%; }
      }

      /* ---- Status and lock ---- */
      .status {
        display: inline-flex; align-items: center; gap: 0.45rem; max-width: 26rem;
        font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.04em; color: var(--muted);
        padding: 0.35rem 0.6rem;
      }
      .status .dot { width: 8px; height: 8px; background: var(--faint); flex: none; }
      .status[data-state="busy"] .dot { background: var(--accent); animation: pulse 1s ease-in-out infinite; }
      .status[data-state="ok"] { color: var(--ok); }
      .status[data-state="ok"] .dot { background: var(--ok); }
      .status[data-state="warn"] { color: var(--warn); }
      .status[data-state="warn"] .dot { background: var(--warn); }
      .status[data-state="err"] { color: var(--err); }
      .status[data-state="err"] .dot { background: var(--err); }
      @keyframes pulse { 50% { opacity: 0.35; } }
      @media (prefers-reduced-motion: reduce) { .status .dot { animation: none !important; } }
      button.lock-notice {
        display: inline-flex; align-items: center; gap: 0.5rem; font-size: 0.85rem;
        border-color: var(--warn); color: var(--warn);
      }
      button.lock-notice .icon { width: 1.05rem; height: 1.05rem; }
      button.lock-notice[data-state="taken"] { border-color: var(--err); color: var(--err); }

      /* ---- The preview: the panel's screen in a bezel ---- */
      .pv-frame { background: var(--bezel); padding: 12px; }
      .pv-viewport { position: relative; overflow: hidden; width: 100%; }
      .pv-screen {
        position: absolute; left: 0; top: 0; transform-origin: 0 0;
        font-family: var(--sans); -webkit-font-smoothing: antialiased;
      }
      .pv-tile { position: absolute; overflow: hidden; cursor: pointer; user-select: none; }
      .pv-tile:hover { outline: 3px solid rgba(181, 232, 83, 0.55); outline-offset: 2px; }
      .pv-tile.selected { outline: 5px solid var(--accent); outline-offset: 3px; overflow: visible; z-index: 3; }
      .pv-tile.dragging { opacity: 0.55; z-index: 5; }
      .pv-tile.invalid { outline: 5px solid var(--err); }
      .pv-tile.unknown { box-shadow: inset 0 0 0 5px #f06a5a; }
      .pv-flag {
        position: absolute; right: 8px; bottom: 8px; padding: 3px 6px; background: #f06a5a; color: #141414;
        font-family: var(--mono); font-size: 13px; font-weight: 700; letter-spacing: 1px; z-index: 2;
      }
      .pv-del {
        position: absolute; top: -18px; right: -18px; width: 36px; height: 36px; padding: 0; z-index: 4;
        display: grid; place-items: center; font-size: 18px; line-height: 1;
        background: var(--ink); color: var(--page); border: 2px solid var(--page);
      }
      .pv-del:hover:not(:disabled) { background: var(--err); }
      .pv-handle {
        position: absolute; right: -6px; bottom: -6px; width: 26px; height: 26px; cursor: nwse-resize; z-index: 4;
        border-right: 6px solid var(--accent); border-bottom: 6px solid var(--accent);
      }
      .pv-edge {
        position: absolute; left: 0; right: 0; height: 0; z-index: 2; pointer-events: none;
        border-top: 3px dashed rgba(181, 232, 83, 0.9);
      }
      .pv-edge span {
        position: absolute; right: 16px; top: 4px; padding: 3px 8px; background: #141414; color: #b5e853;
        font-family: var(--mono); font-size: 14px; letter-spacing: 1px; white-space: nowrap;
      }
      .pv-empty { position: absolute; left: 0; right: 0; top: 40%; text-align: center; font-size: 26px; color: #8a8681; }
      /* Tile contents, in panel pixels (see web/tile_preview.ts). */
      .pv-caption { font-family: var(--mono); font-weight: 500; letter-spacing: 2px; white-space: nowrap; }
      .pv-name { font-weight: 700; line-height: 1.1; overflow: hidden; }
      .pv-text { font-weight: 700; font-size: 22px; line-height: 1.15; overflow: hidden; }
      .pv-centre { text-align: center; }
      .pv-number { display: flex; align-items: baseline; gap: 4px; overflow: hidden; }
      .pv-number { align-items: center; }
      .pv-number .pv-value { font-weight: 800; letter-spacing: -0.02em; line-height: 1; font-variant-numeric: tabular-nums; }
      .pv-number .pv-unit { font-weight: 700; line-height: 1; align-self: flex-end; padding-bottom: 0.12em; }
      .pv-page-title { font-weight: 900; font-size: 46px; letter-spacing: -1.5px; line-height: 1; white-space: nowrap; }
      .pv-bar { width: 64px; height: 8px; }
      .pv-greeting { font-weight: 800; font-size: 34px; letter-spacing: -0.5px; }
      .pv-clock { font-weight: 800; font-size: 55px; letter-spacing: -1px; line-height: 1; }
      .pv-fill { position: absolute; left: 0; right: 0; }
      .pv-qr {
        background:
          conic-gradient(#141414 25%, #fff 0 50%, #141414 0 75%, #fff 0) 0 0 / 22% 22%,
          #fff;
        border: 6px solid #fff;
      }

      /* ---- Inspector form ---- */
      .form { display: flex; flex-direction: column; gap: 0.95rem; }
      .field { display: flex; flex-direction: column; gap: 0.3rem; }
      .field .typeahead { display: block; }
      .flabel { font-size: 0.85rem; font-weight: 700; }
      .fhint { font-size: 0.75rem; line-height: 1.35; color: var(--muted); }
      .color { display: flex; align-items: center; gap: 0.6rem; }
      .color input[type="color"] { width: 40px; height: 32px; padding: 0; border: 2px solid var(--rule-strong); background: none; cursor: pointer; }
      .color input[type="color"]:disabled { opacity: 0.4; cursor: default; }
      .color label { display: inline-flex; align-items: center; gap: 0.35rem; color: var(--muted); font-size: 0.8rem; cursor: pointer; }
      .flags { display: flex; flex-direction: column; gap: 0.7rem; padding-top: 0.8rem; border-top: 2px solid var(--rule); }
      .flag { display: flex; align-items: flex-start; gap: 0.55rem; cursor: pointer; }
      .flag input { margin-top: 2px; }
      .flag-text { display: flex; flex-direction: column; gap: 1px; }
      .flag-name { font-size: 0.88rem; font-weight: 600; }
      .inspector > button.danger { align-self: flex-start; }

      /* ---- Home Assistant connection ---- */
      .ha-bar > summary {
        list-style: none; cursor: pointer; display: flex; align-items: center; gap: 0.5rem;
        font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
      }
      .ha-bar > summary::-webkit-details-marker { display: none; }
      .ha-dot { width: 9px; height: 9px; background: var(--faint); flex: none; }
      .ha-dot[data-state="connected"] { background: var(--ok); }
      .ha-dot[data-state="connecting"] { background: var(--accent); }
      .ha-dot[data-state="error"] { background: var(--err); }
      .ha-fields { display: flex; flex-direction: column; gap: 0.45rem; margin-top: 0.6rem; }
      .ha-error { font-size: 0.78rem; line-height: 1.4; color: var(--err); }

      /* ---- Icon picker ---- */
      .icon-picker { position: relative; }
      .icon-picker-field {
        display: flex; align-items: center; gap: 0.5rem;
        background: var(--input); border: 2px solid var(--rule-strong); padding: 0.3rem 0.5rem;
      }
      .icon-picker.is-open .icon-picker-field { outline: 3px solid var(--accent); outline-offset: 1px; }
      .icon-picker-preview {
        flex: 0 0 auto; width: 2rem; height: 2rem; display: grid; place-items: center;
        font-size: 1.35rem; color: #fff; background: var(--tile);
      }
      .icon-picker-preview--none { color: var(--faint); font-size: 1rem; }
      .icon-picker-input { flex: 1 1 auto; font: inherit; color: var(--ink); background: none; border: none; outline: none; padding: 0.2rem 0; }
      .icon-dropdown {
        display: none; position: absolute; z-index: 20; left: 0; right: 0; top: calc(100% + 4px);
        max-height: 16rem; overflow-y: auto; background: var(--surface); border: 2px solid var(--rule-strong);
      }
      .icon-picker.is-open .icon-dropdown { display: block; }
      .icon-option { display: flex; align-items: center; gap: 0.6rem; padding: 0.4rem 0.6rem; cursor: pointer; font-size: 0.88rem; }
      .icon-option-glyph { flex: 0 0 auto; width: 1.5rem; display: grid; place-items: center; font-size: 1.25rem; }
      .icon-option-glyph--none { color: var(--faint); font-size: 1rem; }
      .icon-option-label { flex: 1 1 auto; }
      .icon-option.is-highlighted { background: var(--accent); color: var(--accent-ink); }
      .icon-option.is-active { font-weight: 700; }
      .icon-option--empty { color: var(--faint); cursor: default; font-style: italic; }
    </style>
  </head>
  <body>
    <div id="app"><div class="boot">Loading the panel's deck…</div></div>
    <script src="/app.js"></script>
  </body>
</html>
