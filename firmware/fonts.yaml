# =============================================================================
# FONTS - the committed MDI TTF + Roboto set, sized for the JC1060P470. Paths
# are relative to firmware/ (build dir is firmware/.esphome). This block is
# standalone: it only !includes the glyph lists and references the TTF.
# =============================================================================
font:
  # Tile icons (top-left)
  - file: '${mdi_font_file}'
    id: font_icon_main
    size: 46
    bpp: 4
    glyphs: !include assets/icon_glyphs.yaml

  # Tile names, units, brightness %
  - file: "gfonts://Roboto"
    id: font_text_body
    size: 22
    bpp: 4
    glyphs: !include assets/text_glyphs.yaml

  # Sensor values (also covers ° and the invalid-state em-dash via text_glyphs)
  - file: "gfonts://Roboto@Light"
    id: font_number_value
    size: 55
    bpp: 4
    glyphs: !include assets/text_glyphs.yaml

  # Medium number — compact values (weather current temp) that need to read
  # bigger than body but not as large as the sensor value font.
  - file: "gfonts://Roboto"
    id: font_number_medium
    size: 34
    bpp: 4
    glyphs: !include assets/text_glyphs.yaml

  # Small secondary text — e.g. the header's high/low beneath the temperature.
  - file: "gfonts://Roboto"
    id: font_text_small
    size: 15
    bpp: 4
    glyphs: !include assets/text_glyphs.yaml

  # Tile names on tight (narrow) tiles — a 2-column tile has ~124px of content,
  # where the 22px body wraps an 11-character title onto two lines.
  - file: "gfonts://Roboto"
    id: font_text_body_tight
    size: 17
    bpp: 4
    glyphs: !include assets/text_glyphs.yaml

  # Screensaver clock. 180px would be ruinous with a full character set, but a
  # clock needs eleven glyphs, so the cost is the digits alone — and scaling the
  # 55px value font up instead would resample a bitmap into mush.
  - file: "gfonts://Roboto@Light"
    id: font_clock_xl
    size: 180
    bpp: 4
    # Exactly the characters screensaver.h's "%02d:%02d" can emit. LVGL skips
    # glyphs it lacks silently rather than failing, so changing that format —
    # a 12-hour clock with AM/PM, say — would render blanks with nothing to
    # catch it but looking at the panel. Change both together.
    glyphs: "0123456789:"
