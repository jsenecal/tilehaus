# Panel behaviour, exposed to Home Assistant rather than stored in the deck.
#
# These are per-panel settings, not per-deck layout: how long before the screen
# dims is a property of this panel in this room, and wanting to change it should
# not mean re-encoding a deck and rebooting. restore_value keeps them across
# reboots, and OTA preserves NVS, so they survive reflashes too.
#
# Every timeout defaults to 0 (disabled), so a freshly flashed panel behaves
# exactly as it did before this existed.

number:
  - platform: template
    name: "Page timeout"
    id: cfg_page_timeout
    entity_category: config
    unit_of_measurement: s
    min_value: 0
    max_value: 3600
    step: 5
    initial_value: 0
    restore_value: true
    optimistic: true
    icon: mdi:home-clock
    on_value:
      - lambda: "tilehaus::idle_config().page_s = (int) x;"

  - platform: template
    name: "Dim timeout"
    id: cfg_dim_timeout
    entity_category: config
    unit_of_measurement: s
    min_value: 0
    max_value: 3600
    step: 5
    initial_value: 0
    restore_value: true
    optimistic: true
    icon: mdi:brightness-4
    on_value:
      - lambda: "tilehaus::idle_config().dim_s = (int) x;"

  - platform: template
    name: "Sleep timeout"
    id: cfg_sleep_timeout
    entity_category: config
    unit_of_measurement: s
    min_value: 0
    max_value: 3600
    step: 5
    initial_value: 0
    restore_value: true
    optimistic: true
    icon: mdi:sleep
    on_value:
      - lambda: "tilehaus::idle_config().sleep_s = (int) x;"

  - platform: template
    name: "Brightness"
    id: cfg_brightness
    entity_category: config
    unit_of_measurement: "%"
    # Floored at 10, unlike dim/sleep where 0 is a meaningful "go dark". At 0 the
    # awake level turns the backlight off, which fails the brightness>0 term of
    # hardware.yaml's input gate, so input devices are never re-enabled — and
    # touching the panel restores brightness *to* this value, i.e. still 0. The
    # panel becomes untouchable and is recoverable only from Home Assistant.
    min_value: 10
    max_value: 100
    step: 1
    initial_value: 100
    restore_value: true
    optimistic: true
    icon: mdi:brightness-7
    on_value:
      - lambda: "tilehaus::idle_config().brightness = (int) x;"

  - platform: template
    name: "Dim brightness"
    id: cfg_dim_brightness
    entity_category: config
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 25
    restore_value: true
    optimistic: true
    icon: mdi:brightness-5
    on_value:
      - lambda: "tilehaus::idle_config().dim_brightness = (int) x;"

  - platform: template
    name: "Sleep brightness"
    id: cfg_sleep_brightness
    entity_category: config
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 0
    restore_value: true
    optimistic: true
    icon: mdi:brightness-2
    on_value:
      - lambda: "tilehaus::idle_config().sleep_brightness = (int) x;"

select:
  - platform: template
    name: "Screensaver"
    id: cfg_screensaver
    entity_category: config
    options: ["None", "Clock"]
    initial_option: "None"
    restore_value: true
    optimistic: true
    icon: mdi:clock-digital
    on_value:
      - lambda: 'tilehaus::idle_config().screensaver_enabled = (x == "Clock");'

output:
  # The three channels behind the accent light below. ESPHome has no built-in
  # "virtual RGB light" platform — a template light only supports a single
  # on/off/brightness style state, not three independently-addressable
  # channels — so the standard construction is a real `rgb` light backed by
  # three `output: platform: template` float outputs. write_action fires per
  # channel on every colour change; there is nothing to *do* with a channel in
  # isolation (no hardware behind it), so each is a no-op and the light's
  # own on_state below reads the assembled RGB back out as a whole.
  - platform: template
    id: accent_out_r
    type: float
    write_action:
      - lambda: "return;"
  - platform: template
    id: accent_out_g
    type: float
    write_action:
      - lambda: "return;"
  - platform: template
    id: accent_out_b
    type: float
    write_action:
      - lambda: "return;"

light:
  # A real RGB light, so Home Assistant renders its native colour wheel rather
  # than a generic toggle. entity_category config marks it as a setting rather
  # than a room lamp, so it stays out of "turn all lights off" sweeps.
  #
  # off means "use the accent the deck itself specifies" (per-card colours);
  # on means "override every card's accent live with this colour", with no
  # rebuild or reboot — see tilehaus::set_accent(). on_state fires whenever HA
  # (or anything else) changes the light, and reads the just-set state back out
  # of the light itself rather than threading it through the three outputs.
  - platform: rgb
    name: "Accent"
    id: cfg_accent
    entity_category: config
    restore_mode: ALWAYS_OFF
    default_transition_length: 0s
    red: accent_out_r
    green: accent_out_g
    blue: accent_out_b
    on_state:
      - lambda: |-
          auto &v = id(cfg_accent).remote_values;
          if (v.is_on()) {
            // lroundf, not a plain cast: the channels are floats that rarely
            // land exactly on an integer (128/255 round-trips as 0.50196...),
            // and a C cast truncates toward zero — biasing every channel low by
            // up to 1 and making the colour not round-trip.
            uint32_t rgb = (((uint32_t) lroundf(v.get_red() * 255.0f)) << 16) |
                           (((uint32_t) lroundf(v.get_green() * 255.0f)) << 8) |
                           ((uint32_t) lroundf(v.get_blue() * 255.0f));
            tilehaus::set_accent(true, rgb);
          } else {
            tilehaus::set_accent(false, 0);
          }

switch:
  # Night mode: the page goes dark and its text light; tiles are unchanged.
  # Applied live by recolouring (tilehaus::set_night_mode), no rebuild or
  # reboot. A switch rather than a deck setting so an HA automation can flip it
  # at sunset, and a deck tile can bind to it.
  - platform: template
    name: "Night mode"
    id: cfg_night_mode
    entity_category: config
    icon: mdi:weather-night
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - lambda: "tilehaus::set_night_mode(true);"
    on_turn_off:
      - lambda: "tilehaus::set_night_mode(false);"

  # Opens the configurator for writing. While on, the first browser or CLI to
  # claim a session gets a random key and is the only client that can save or
  # reset; turning it off revokes that key. It turns itself off after
  # ${configurator_timeout} minutes without configurator use.
  #
  # The native lock owns this state, persisted with the key so a session
  # carries across the reboot every save causes. restore_mode DISABLED stops
  # ESPHome from also restoring the switch: its default (ALWAYS_OFF) would turn
  # it off at every boot and revoke the session it just restored.
  # A touch on a dark screen brings it up at Dim brightness instead of full;
  # the next touch goes to full. Off by default.
  - platform: template
    name: "Wake dimmed"
    id: cfg_wake_dimmed
    entity_category: config
    icon: mdi:brightness-4
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - lambda: "tilehaus::idle_config().wake_dimmed = true;"
    on_turn_off:
      - lambda: "tilehaus::idle_config().wake_dimmed = false;"

  - platform: template
    name: "Configurator"
    id: sw_configurator
    entity_category: config
    icon: mdi:lock-open-variant
    restore_mode: DISABLED
    lambda: "return tilehaus::config_session_is_open();"
    turn_on_action:
      - lambda: "tilehaus::config_session_set_open(true);"
    turn_off_action:
      - lambda: "tilehaus::config_session_set_open(false);"

button:
  - platform: template
    name: "Wake"
    id: btn_wake
    icon: mdi:gesture-tap
    on_press:
      - lambda: "tilehaus::panel_wake();"

  - platform: restart
    name: "Restart"
    id: btn_restart
    entity_category: diagnostic

binary_sensor:
  - platform: template
    name: "In use"
    id: sens_in_use
    device_class: occupancy
    lambda: |-
      const int dim_s = tilehaus::idle_config().dim_s;
      if (dim_s <= 0) return true;   // never dims, so always "in use"
      return lv_display_get_inactive_time(nullptr) < (uint32_t) dim_s * 1000u;

text:
  # The guest network a Wi-Fi share tile shows as a QR code. Here rather than
  # in the deck, because the deck is readable by anyone on the network. Both
  # survive reboots and reflashes (NVS). The password field is masked in the
  # HA UI, but its value is still the entity's state: exclude it from the
  # recorder if that matters to you.
  - platform: template
    name: "Guest Wi-Fi name"
    id: cfg_guest_ssid
    entity_category: config
    icon: mdi:wifi
    mode: text
    min_length: 0
    max_length: 32
    optimistic: true
    restore_value: true
    initial_value: ""
    on_value:
      - lambda: |-
          tilehaus::guest_wifi().ssid = x;
          tilehaus::guest_wifi().changed();

  - platform: template
    name: "Guest Wi-Fi password"
    id: cfg_guest_password
    entity_category: config
    icon: mdi:form-textbox-password
    mode: password
    min_length: 0
    max_length: 63
    optimistic: true
    restore_value: true
    initial_value: ""
    on_value:
      - lambda: |-
          tilehaus::guest_wifi().password = x;
          tilehaus::guest_wifi().changed();

  # Presence wake: an occupancy sensor's entity id (e.g.
  # binary_sensor.office_presence). Arriving wakes the screen, and while it
  # reads "on" the panel neither dims nor sleeps. Read at boot, so a change
  # takes effect after a restart (the panel's Restart button).
  - platform: template
    name: "Presence sensor"
    id: cfg_presence_entity
    entity_category: config
    icon: mdi:motion-sensor
    mode: text
    min_length: 0
    max_length: 100
    optimistic: true
    restore_value: true
    initial_value: ""
    on_value:
      - lambda: "tilehaus::presence_wake().entity = x;"

text_sensor:
  # "Locked", "Open", or "In use by <ip>" — who holds the configurator session.
  - platform: template
    name: "Configurator status"
    id: sens_configurator_status
    entity_category: diagnostic
    icon: mdi:shield-account

  - platform: template
    name: "Current page"
    id: sens_current_page
    entity_category: diagnostic
    icon: mdi:page-layout-header

sensor:
  - platform: uptime
    name: "Uptime"
    id: sens_uptime
    entity_category: diagnostic
