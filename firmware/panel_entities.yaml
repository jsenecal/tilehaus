# Panel behaviour, exposed to Home Assistant rather than stored in the deck.
#
# These are per-panel settings, not per-deck layout: how long before the screen
# dims is a property of this panel in this room, and wanting to change it should
# not mean re-encoding a deck and rebooting. restore_value keeps them across
# reboots, and OTA preserves NVS, so they survive reflashes too.
#
# Every timeout defaults to 0 (disabled), so a freshly flashed panel behaves
# exactly as it did before this existed.

number:
  - platform: template
    name: "Page timeout"
    id: cfg_page_timeout
    entity_category: config
    unit_of_measurement: s
    min_value: 0
    max_value: 3600
    step: 5
    initial_value: 0
    restore_value: true
    optimistic: true
    icon: mdi:home-clock
    on_value:
      - lambda: "tilehaus::idle_config().page_s = (int) x;"

  - platform: template
    name: "Dim timeout"
    id: cfg_dim_timeout
    entity_category: config
    unit_of_measurement: s
    min_value: 0
    max_value: 3600
    step: 5
    initial_value: 0
    restore_value: true
    optimistic: true
    icon: mdi:brightness-4
    on_value:
      - lambda: "tilehaus::idle_config().dim_s = (int) x;"

  - platform: template
    name: "Sleep timeout"
    id: cfg_sleep_timeout
    entity_category: config
    unit_of_measurement: s
    min_value: 0
    max_value: 3600
    step: 5
    initial_value: 0
    restore_value: true
    optimistic: true
    icon: mdi:sleep
    on_value:
      - lambda: "tilehaus::idle_config().sleep_s = (int) x;"

  - platform: template
    name: "Brightness"
    id: cfg_brightness
    entity_category: config
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 100
    restore_value: true
    optimistic: true
    icon: mdi:brightness-7
    on_value:
      - lambda: "tilehaus::idle_config().brightness = (int) x;"

  - platform: template
    name: "Dim brightness"
    id: cfg_dim_brightness
    entity_category: config
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 25
    restore_value: true
    optimistic: true
    icon: mdi:brightness-5
    on_value:
      - lambda: "tilehaus::idle_config().dim_brightness = (int) x;"

  - platform: template
    name: "Sleep brightness"
    id: cfg_sleep_brightness
    entity_category: config
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 0
    restore_value: true
    optimistic: true
    icon: mdi:brightness-2
    on_value:
      - lambda: "tilehaus::idle_config().sleep_brightness = (int) x;"

select:
  - platform: template
    name: "Screensaver"
    id: cfg_screensaver
    entity_category: config
    options: ["None", "Clock"]
    initial_option: "None"
    restore_value: true
    optimistic: true
    icon: mdi:clock-digital
    on_value:
      - lambda: 'tilehaus::idle_config().screensaver_enabled = (x == "Clock");'

output:
  # The three channels behind the accent light below. ESPHome has no built-in
  # "virtual RGB light" platform — a template light only supports a single
  # on/off/brightness style state, not three independently-addressable
  # channels — so the standard construction is a real `rgb` light backed by
  # three `output: platform: template` float outputs. write_action fires per
  # channel on every colour change; there is nothing to *do* with a channel in
  # isolation (no hardware behind it), so each is a no-op and the light's
  # own on_state below reads the assembled RGB back out as a whole.
  - platform: template
    id: accent_out_r
    type: float
    write_action:
      - lambda: "return;"
  - platform: template
    id: accent_out_g
    type: float
    write_action:
      - lambda: "return;"
  - platform: template
    id: accent_out_b
    type: float
    write_action:
      - lambda: "return;"

light:
  # A real RGB light, so Home Assistant renders its native colour wheel rather
  # than a generic toggle. entity_category config marks it as a setting rather
  # than a room lamp, so it stays out of "turn all lights off" sweeps.
  #
  # off means "use the accent the deck itself specifies" (per-card colours);
  # on means "override every card's accent live with this colour", with no
  # rebuild or reboot — see tilehaus::set_accent(). on_state fires whenever HA
  # (or anything else) changes the light, and reads the just-set state back out
  # of the light itself rather than threading it through the three outputs.
  - platform: rgb
    name: "Accent"
    id: cfg_accent
    entity_category: config
    restore_mode: ALWAYS_OFF
    default_transition_length: 0s
    red: accent_out_r
    green: accent_out_g
    blue: accent_out_b
    on_state:
      - lambda: |-
          auto &v = id(cfg_accent).remote_values;
          if (v.is_on()) {
            uint32_t rgb = (((uint32_t) (v.get_red() * 255)) << 16) |
                           (((uint32_t) (v.get_green() * 255)) << 8) |
                           ((uint32_t) (v.get_blue() * 255));
            tilehaus::set_accent(true, rgb);
          } else {
            tilehaus::set_accent(false, 0);
          }

button:
  - platform: template
    name: "Wake"
    id: btn_wake
    icon: mdi:gesture-tap
    on_press:
      - lambda: "tilehaus::panel_wake();"

  - platform: restart
    name: "Restart"
    id: btn_restart
    entity_category: diagnostic

binary_sensor:
  - platform: template
    name: "In use"
    id: sens_in_use
    device_class: occupancy
    lambda: |-
      const int dim_s = tilehaus::idle_config().dim_s;
      if (dim_s <= 0) return true;   // never dims, so always "in use"
      return lv_display_get_inactive_time(nullptr) < (uint32_t) dim_s * 1000u;

text_sensor:
  - platform: template
    name: "Current page"
    id: sens_current_page
    entity_category: diagnostic
    icon: mdi:page-layout-header

sensor:
  - platform: uptime
    name: "Uptime"
    id: sens_uptime
    entity_category: diagnostic
