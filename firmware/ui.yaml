lvgl:
  id: main_lvgl
  displays: my_display
  # The stock device profile pairs a static 180 base with a runtime 180
  # rotation that nets back to upright. Tilehaus carries only the static value,
  # so 0 — not 180 — is what leaves the panel the right way up.
  rotation: 0
  byte_order: little_endian
  default_font: font_text_body
  touchscreens:
    - touchscreen_id: my_touchscreen
  pages:
    - id: poc_page
      bg_color: 0x000000
      widgets:
        # Empty container — C++ (poc_build_cards) applies the grid and creates
        # every cell/widget at boot. LVGL features are forced on via build_flags
        # so no seed widgets are needed here.
        - obj:
            id: grid_root
            width: 100%
            height: 100%
            bg_opa: TRANSP
            border_width: 0
            scrollable: false
