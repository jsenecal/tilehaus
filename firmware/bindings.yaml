esphome:
  on_boot:
    - priority: -100
      then:
        - lambda: |-
            tilehaus::app_clock() = id(poc_time);
            // Designated initialisers on purpose: this struct used to be
            // filled positionally, where inserting a field mid-struct would
            // silently shift every later font by one with no compiler error.
            static tilehaus::CardFonts poc_fonts{
                .icon = id(font_icon_main)->get_lv_font(),
                .value = id(font_number_value)->get_lv_font(),
                .body = id(font_text_body)->get_lv_font(),
                .medium = id(font_number_medium)->get_lv_font(),
                .small = id(font_text_small)->get_lv_font(),
                .body_tight = id(font_text_body_tight)->get_lv_font(),
            };
            // Boot splash on top of everything; fades out on the first HA state.
            tilehaus::splash_build(poc_fonts);
            tilehaus::splash_set("\U000F05A9", "Connecting",
                            "Connecting to Wi-Fi");  // mdi-wifi
            tilehaus::ha_first_state_hook() = []() { tilehaus::splash_hide(); };
            // Darken the panel just before a config-apply reboot, so the reset's
            // garbage frames are never visible. restore_mode ALWAYS_ON brings it
            // back at boot.
            tilehaus::pre_reboot_hook() = []() {
              auto call = id(display_backlight).turn_off();
              call.set_transition_length(0);
              call.perform();
            };
            tilehaus::set_brightness_hook() = [](int pct) {
              auto call = id(display_backlight).turn_on();
              call.set_brightness(pct / 100.0f);
              call.set_transition_length(300);
              call.perform();
            };
            tilehaus::page_report_hook() = [](const std::string &name) {
              id(sens_current_page).publish_state(name);
            };
            tilehaus::screensaver_build(poc_fonts);
            // Load any persisted deck config before the first build so the
            // panel boots straight into the saved deck (else default_deck()).
            tilehaus::deck_store().setup();
            tilehaus::poc_build_cards(id(grid_root),
                ${grid_unit}, ${grid_pad}, ${grid_gap}, ${grid_subdivisions},
                ${grid_cols}, ${grid_rows}, ${tile_radius}, poc_fonts);

# The main api: block lives in tilehaus.yaml; this merges in via ESPHome's
# package-config merge (dicts merge key-by-key, so this only adds `services`
# to the existing api: block rather than replacing it).
api:
  services:
    - service: show_page
      variables:
        page: string
      then:
        - lambda: "tilehaus::show_page(page);"

# Deck-config HTTP API + reboot-to-apply. start_deck_server() is idempotent and
# retries until networking is ready. A successful PUT persists the doc and flags
# a reboot on the httpd task; apply_pending_reboot() performs it here on the main
# loop, so the new deck is rebuilt cleanly on the next boot.
interval:
  - interval: 200ms
    then:
      - lambda: |-
          tilehaus::start_deck_server();
          tilehaus::apply_pending_reboot();
