substitutions:
  name: "tilehaus"
  friendly_name: "Tilehaus"
  # Grid tuning — all layout knobs in one place.
  grid_cols: "5"            # base (pre-split) columns; 0 = auto from grid_unit
  grid_rows: "3"            # base (pre-split) rows;    0 = auto from grid_unit
  grid_unit: "200"          # target normal-tile size in px (used when cols/rows = 0)
  grid_gap: "10"            # spacing between tiles in px
  grid_pad: "16"            # outer padding around the grid in px
  grid_subdivisions: "2"    # sub-cells per normal unit (2 = half-units)
  tile_radius: "10"         # tile corner radius in px
  mdi_font_file: "assets/materialdesignicons-webfont-7.4.47.ttf"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  platformio_options:
    build_flags:
      - "-DLV_USE_OBSERVER=1"
      # Live FPS / CPU overlay (bottom-right) to measure framerate while tuning.
      # The perf monitor lives inside sysmon in LVGL 9, so both are required.
      - "-DLV_USE_SYSMON=1"
      - "-DLV_USE_PERF_MONITOR=1"
      # Cards build widgets in C++, so ESPHome's "only compile LVGL features
      # used in YAML" heuristic would strip these. Force them on (same flag
      # mechanism as the observer) so grid_root can stay empty — no seed widgets.
      - "-DLV_USE_LABEL=1"
      - "-DLV_USE_SLIDER=1"
      - "-DLV_USE_ARC=1"
      - "-DLV_USE_DROPDOWN=1"
      - "-DLV_USE_IMAGE=1"
      - "-DLV_USE_BAR=1"
      - "-DLV_USE_BUTTON=1"
      - "-DLV_USE_GRID=1"
      - "-DLV_USE_FLEX=1"
  includes:
    - native

packages:
  hardware: !include hardware.yaml
  ui: !include ui.yaml
  fonts: !include fonts.yaml
  bindings: !include bindings.yaml

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # The JC1060P470's Wi-Fi is a hosted ESP32-C6 over SDIO. With the default
  # light-sleep power save the radio parks between AP beacons, which showed up
  # as seconds-of-lag on HA commands and silently dropped state pushes. Keep the
  # radio awake for this always-powered panel.
  power_save_mode: none
  # Default reboot_timeout is 15min: a Wi-Fi dropout would reboot the whole
  # panel (looked like "random reboots"). Disable so a link blip no longer
  # power-cycles a UI that is otherwise running fine.
  reboot_timeout: 0s
  # The 'IoT' SSID is hidden, so a normal pre-connect scan returns "No networks
  # found" and the panel loops for ~17s before associating. fast_connect skips
  # the scan and dials the stored credentials directly — the reliable path for
  # hidden networks and much faster reconnects after an AP 'Auth Expired' deauth.
  fast_connect: true
  on_connect:
    # Wi-Fi is up; the splash now waits on Home Assistant (hidden by the first
    # HA state via ha_first_state_hook). mdi-home-assistant glyph.
    - lambda: |-
        tilehaus::splash_set("\U000F07D0", "Almost ready",
                        "Waiting for Home Assistant");

sensor:
  # Measure link quality so we can tell power-save lag apart from weak coverage.
  - platform: wifi_signal
    name: "Tilehaus Wi-Fi RSSI"
    update_interval: 15s

logger:

time:
  - platform: homeassistant
    id: poc_time

api:
  homeassistant_states: true
  homeassistant_services: true
  on_client_disconnected:
    # HA (or Wi-Fi) dropped: re-arm the first-state latch and bring the splash
    # back so the panel shows it's reconnecting rather than stale data.
    - lambda: |-
        tilehaus::ha_arm_first_state();
        tilehaus::splash_set("\U000F07D0", "Reconnecting",
                        "Lost connection to Home Assistant");
        tilehaus::splash_show();

ota:
  - platform: esphome
